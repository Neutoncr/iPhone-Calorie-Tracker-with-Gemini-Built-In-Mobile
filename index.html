<style>

.ic.s{width:28px;height:28px;border-radius:10px;font-size:16px;margin-right:9px;vertical-align:middle;display:inline-grid}
.me{color:var(--e)}.mf{color:var(--f)}.mk{color:var(--k)}u{text-decoration:none}
.add{background:color-mix(in srgb,var(--c,#fff) 26%,transparent);color:var(--c,#fff)}
.mh .ic{margin-right:2px}.st b{display:block}
.card.hero{background:linear-gradient(150deg,rgba(255,138,76,.22),rgba(32,32,35,.72) 60%)}
.mac>div:first-child span:first-child{display:flex;align-items:center}
.bar{height:10px}.bar i{box-shadow:0 0 12px color-mix(in srgb,currentColor 40%,transparent)}
.lens{background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 60%,rgba(255,255,255,.2)),color-mix(in srgb,var(--tc) 24%,rgba(255,255,255,.05)));transition:transform .45s cubic-bezier(.3,1.35,.5,1),background .4s}
.tabs button.on svg{stroke:#fff;filter:drop-shadow(0 0 6px var(--tc))}
#fab.glass{background:linear-gradient(145deg,rgba(255,160,100,.8),rgba(255,95,60,.5));color:#fff}
.chips button.on{box-shadow:0 2px 12px rgba(255,255,255,.25)}
.pill.qc{background:linear-gradient(145deg,#bba5ff,#7c4dff);color:#fff;box-shadow:0 6px 18px rgba(124,77,255,.4)}
.rec{display:flex;gap:10px;overflow-x:auto;margin:0 0 14px}.rec:empty{display:none}.rec button{flex:none;width:74px;text-align:center;font-size:12.5px;color:var(--tx)}
.rec .ic{width:58px;height:58px;font-size:32px;position:relative;margin:0 auto 5px}.rec u{position:absolute;right:-5px;bottom:-5px;width:24px;height:24px;border-radius:50%;background:#2b2b2f;border:1px solid rgba(255,255,255,.22);font-size:16px;display:grid;place-items:center}
.rec span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt{color:var(--mu);font-size:14px;margin:-2px 0 8px}
.lg{display:flex;justify-content:center;gap:20px;font-size:13.5px;margin-top:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.05)}.lg span{display:flex;align-items:center;gap:6px}.lg svg{width:20px;height:20px}
.tr{display:grid;grid-template-columns:56px 64px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(255,255,255,.08)}.tr b{font-weight:600}.tt{display:flex;gap:6px;align-items:center;font-size:14px}.tt svg{width:20px;height:20px}.sp{width:64px;height:28px}
.fl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:linear-gradient(150deg,rgba(255,110,40,.3),rgba(32,32,35,.72) 65%)}
.fn{display:flex;align-items:center;gap:8px}.fn span{font-size:42px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,120,40,.75))}.fn span.off{filter:grayscale(1);opacity:.45}.fn b{font-size:32px;font-weight:650;line-height:1;display:block}.fn small{font-size:12.5px}
.fw{display:flex;gap:7px}.fw div{text-align:center}.fw em{display:block;font-style:normal;font-size:23px;filter:grayscale(1);opacity:.28}.fw .on em{filter:drop-shadow(0 0 7px rgba(255,120,40,.85));opacity:1}.fw small{font-size:11px}
.xt{width:100%;border-collapse:collapse;font-size:15px}.xt th{color:var(--mu);font-weight:500;font-size:13px;text-align:left;padding:2px 4px 8px}.xt td{padding:8px 4px;border-top:1px solid rgba(255,255,255,.08)}.xt td:first-child{font-weight:550}.xt .x{width:30px;height:30px}
.tw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 6px}.tw button{padding:8px 0;border-radius:16px;background:rgba(255,255,255,.06);border:1.5px solid transparent;font-size:12px;color:var(--mu)}.tw i{display:block;font-style:normal;font-size:20px;height:26px;line-height:26px}.tw .tn{background:rgba(61,220,151,.22)}.tw .rs{background:rgba(77,163,255,.18)}.tw .cu{border-color:rgba(255,255,255,.55);color:#fff}
.pill.gt.on{background:#3ddc97;color:#06281a}.pill.gr.on{background:#4da3ff;color:#031b36}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bd div{text-align:center;padding:12px 4px;border-radius:18px;background:rgba(255,255,255,.05);opacity:.55}.bd div.ok{opacity:1;background:linear-gradient(150deg,rgba(255,200,60,.3),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}.bd i{display:block;font-style:normal;font-size:30px;filter:grayscale(1)}.bd .ok i{filter:none}.bd b{display:block;font-size:13px;font-weight:600;line-height:1.2;margin-top:4px}.bd small{font-size:11.5px}
.lnk{display:block;margin:10px auto 0;color:var(--mu);font-size:14px;text-decoration:underline}
select{width:100%;background:var(--in);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:13px 10px;font-size:16px;color:var(--tx)}
a{color:var(--ac)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header id="hd"></header>
<main id="v"></main>
<nav id="dock">
  <div class="tabs glass" id="tabs"><i class="lens"></i>
    <button data-a="tab" data-t="h"></button><button data-a="tab" data-t="c"></button><button data-a="tab" data-t="b"></button><button data-a="tab" data-t="v"></button><button data-a="tab" data-t="m"></button>
  </div>
  <button class="round glass" id="fab" data-a="open" aria-label="Essen hinzufügen"></button>
</nav>

<div class="sheet" id="sh" data-a="bg"><div class="panel glass">
  <div class="grab"></div>
  <div class="chips" id="seg"><button data-a="seg" data-s="ki" class="on">✨ KI &amp; Foto</button><button data-a="seg" data-s="tx">⚡ Text</button><button data-a="seg" data-s="ma">✏️ Manuell</button></div>
  <div class="chips" id="ml"></div>
  <div class="rec" id="rec"></div>
  <div class="sec on" id="s-ki">
    <input id="gq" placeholder="z. B. 2 Scheiben Vollkornbrot mit Butter" enterkeyhint="go">
    <div class="pics" id="pics"></div>
    <div class="row" style="margin-top:0"><button class="pill ghost" data-a="pick" style="flex:1">📷 Foto hinzufügen</button></div>
    <input type="file" id="fi" accept="image/*" multiple hidden>
    <div class="row"><button class="pill" id="gg" data-a="gem">Mit Gemini berechnen</button></div>
    <p class="mu" style="font-size:13px;margin:10px 2px 0">Mehrere Fotos möglich: Teller, Verpackung, Nährwerttabelle. Ohne Foto reicht auch Text.</p>
  </div>
  <div class="sec" id="s-tx">
    <textarea id="ta" placeholder="Apfel | kcal:104,k:13,f:10,E:31&#10;oder nur: kcal:104,k:13,f:10,E:31" spellcheck="false"></textarea>
    <div class="pv" id="pv"></div>
    <button class="pill" data-a="addt">Hinzufügen</button>
    <div class="row"><button class="pill ghost" data-a="gp" style="flex:1;font-size:15px;padding:11px">Gemini-Prompt kopieren</button></div>
    <p class="mu" style="font-size:13px;margin:10px 2px 0">k = Kohlenhydrate, f = Fett, E = Eiweiß (g). Mehrere Zeilen werden zusammen eingetragen. Fehlen kcal, werden sie berechnet.</p>
  </div>
  <div class="sec" id="s-ma">
    <input id="mn" placeholder="Name">
    <div class="g2" style="margin-top:8px"><input id="mk" type="number" inputmode="decimal" placeholder="kcal"><input id="mc" type="number" inputmode="decimal" placeholder="Kohlenhydrate g"><input id="mf" type="number" inputmode="decimal" placeholder="Fett g"><input id="me" type="number" inputmode="decimal" placeholder="Eiweiß g"></div>
    <div class="row"><button class="pill" data-a="addm">Hinzufügen</button></div>
  </div>
</div></div>
<div class="toast glass" id="ts"></div>

<script>
const KEY='kalorientracker-v1',MEALS=[['fr','Frühstück'],['mi','Mittagessen'],['ab','Abendessen'],['sn','Snacks']];
const DEF={goals:{kcal:2000,k:250,f:65,e:100,cr:5,wt:0,tw:3},days:{},cr:{},w:{},tr:{},pr:[],ex:{}};
const norm=p=>({goals:{...DEF.goals,...(p.goals||{})},days:p.days||{},cr:p.cr||{},w:p.w||{},tr:p.tr||{},pr:p.pr||[],ex:p.ex||{}});
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),r1=n=>Math.round(n*10)/10,fmt=n=>Math.round(n).toLocaleString('de-DE');
const P={l:'M15 5l-7 7 7 7',r:'M9 5l7 7-7 7',x:'M6 6l12 12M18 6L6 18',p:'M12 5v14M5 12h14',h:'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z',c:'M13 2L4 14h7l-1 8 9-12h-7z',v:'M3 17l6-6 4 4 8-9',b:'M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11',m:'M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1',up:'M3 17l6-6 4 4 8-8M15 7h6v6',dn:'M3 7l6 6 4-4 8 8M15 17h6v-6',cam:'M4 8h3l2-2h6l2 2h3v11H4zM12 16.5a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
function load(){try{const p=JSON.parse(localStorage.getItem(KEY));if(p)return norm(p)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Speichern nicht möglich')}}
const gget=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
let S=load(),cur=iso(new Date()),tab='h',rng=7,wr=30,meal='fr',pics=[];
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const dayF=d=>S.days[d]||[],crL=d=>S.cr[d]||[],crT=d=>crL(d).reduce((t,x)=>t+x.g,0);
const sum=a=>a.reduce((t,x)=>({kcal:t.kcal+x.kcal,k:t.k+x.k,f:t.f+x.f,e:t.e+x.e}),{kcal:0,k:0,f:0,e:0});
const nice=d=>cur===iso(new Date())?'Heute':new Date(cur+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long'});

// Parser (wie in deiner Originaldatei)
const KEYS='kcal|kal|kh|k|f|fett|e|eiweiss|eiweiß|protein|p|carbs';
const RE=new RegExp('(?<![a-zäöüß])('+KEYS+')\\s*[:=]\\s*(\\d+(?:[.,]\\d+)?)','gi'),RE0=new RegExp('(?<![a-zäöüß])('+KEYS+')\\s*[:=]\\s*\\d','i');
function parse(line){const i=line.search(RE0);if(i<0)return null;const o={};
  for(const m of line.matchAll(RE)){const k=m[1].toLowerCase(),v=parseFloat(m[2].replace(',','.'));o[/^kcal$|^kal$/.test(k)?'kcal':/^(k|kh|carbs)$/.test(k)?'k':/^f/.test(k)?'f':'e']=v}
  const k=o.k||0,f=o.f||0,e=o.e||0,name=line.slice(0,i).replace(/[*`_#]/g,'').replace(/^[\s\-–•]+|[\s|:;,\-–]+$/g,'')||'Eintrag';
  return{name,kcal:o.kcal!=null?o.kcal:Math.round(4*k+9*f+4*e),k,f,e}}
const parseAll=t=>t.split(/\r?\n/).map(parse).filter(Boolean);

function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Kopiert')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Kopiert')}catch(x){toast('Kopieren nicht möglich')}a.remove()}}
function vib(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}

  <div class="card"><h3>💪 Training</h3><div class="g2"><button class="pill ghost gt ${S.tr[cur]==='t'?'on':''}" data-a="tr" data-v="t">💪 Trainiert</button><button class="pill ghost gr ${S.tr[cur]==='r'?'on':''}" data-a="tr" data-v="r">😴 Ruhetag</button></div>
  <div class="tw">${wd.map(d=>{const k=iso(d),v=S.tr[k];return`<button data-a="go" data-k="${k}" class="${v==='t'?'tn':v==='r'?'rs':''} ${k===cur?'cu':''}">${d.toLocaleDateString('de-DE',{weekday:'short'}).slice(0,2)}<i>${v==='t'?'💪':v==='r'?'😴':''}</i></button>`}).join('')}</div>
  <div class="mu" style="text-align:center;font-size:14px">${nW} von ${G.tw} Trainings diese Woche${nW>=G.tw&&G.tw>0?' 🎉':''}</div></div>
  <div class="card"><h3>📋 Übungen · ${nice()}</h3>`+(E.length?`<table class="xt"><tr><th>Übung</th><th>kg</th><th>Wdh./Zeit</th><th>Sätze</th><th></th></tr>${E.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.kg?nm(x.kg):'–'}</td><td>${esc(x.r)||'–'}</td><td>${x.s}</td><td><button class="x" data-a="xdel" data-d="${x.id}" aria-label="Löschen">${ic('x')}</button></td></tr>`).join('')}</table>${vol?`<div class="mu" style="margin-top:8px;font-size:14px">Volumen: <b style="color:var(--tx)">${fmt(vol)} kg</b></div>`:''}`:'<div class="empty">Noch keine Übung eingetragen.</div>')+`
  <datalist id="exl">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><input id="xn" list="exl" placeholder="Übung, z. B. Bankdrücken" style="margin-top:12px"><div class="g2" style="grid-template-columns:repeat(3,1fr);margin-top:8px"><input id="xk" inputmode="decimal" placeholder="kg"><input id="xr" placeholder="Wdh./Zeit"><input id="xs" type="number" inputmode="numeric" placeholder="Sätze"></div><div class="row"><button class="pill" data-a="xadd">Eintragen</button></div><p class="mu" style="font-size:13px;margin:8px 2px 0">Wdh./Zeit: z. B. 8 oder 45 s. Ein höheres Gewicht als je zuvor wird automatisch als Rekord gespeichert.</p></div>
  <div class="card"><h3>🏆 Persönliche Rekorde</h3>`+(S.pr.length?[...S.pr].sort((a,b)=>b.id-a.id).map(x=>{const best=S.pr.filter(y=>y.n.toLowerCase()===x.n.toLowerCase()&&y.u===x.u).every(y=>y.v<=x.v);return`<div class="it"><i class="ic" style="--c:#ffd24d">${best?'🥇':'🏆'}</i><div class="n"><b>${esc(x.n)}</b><small><u style="color:#ffd24d">${nm(x.v)} ${esc(x.u)}</u> • ${new Date(x.d+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'})}</small></div><button class="x" data-a="pdel" data-d="${x.id}" aria-label="Löschen">${ic('x')}</button></div>`}).join(''):'<div class="empty">Noch kein Rekord. Trag deinen ersten ein.</div>')+`
  <input id="pn" list="exl" placeholder="Übung" style="margin-top:12px"><div class="g2" style="margin-top:8px"><input id="pv" inputmode="decimal" placeholder="Wert"><select id="pu"><option>kg</option><option>Wdh.</option><option>min</option><option>s</option><option>km</option><option>m</option></select></div><div class="row"><button class="pill" data-a="padd">Rekord speichern</button></div></div>
  <div class="card"><h3>🎖️ Ziele erreicht · ${ok}/${B.length}</h3><div class="bd">${B.map(x=>`<div class="${x[2]?'ok':''}"><i>${x[0]}</i><b>${x[1]}</b><small>${x[2]?'Erreicht ✓':x[3]}</small></div>`).join('')}</div></div>`},
v(){const s=series(rng),h=s.filter(x=>x.has),avg=h.length?h.reduce((t,x)=>t+x.kcal,0)/h.length:0,m=Math.floor(h.length/2),av=a=>a.length?a.reduce((t,x)=>t+x.kcal,0)/a.length:0,df=m?av(h.slice(h.length-m))-av(h.slice(0,m)):0;
  return`<div class="chips">${[[7,'1W'],[30,'1M'],[90,'3M']].map(([n,l])=>`<button data-a="rng" data-r="${n}" class="${n===rng?'on':''}">${l}</button>`).join('')}</div>
  <div class="card"><h3>🔥 Kalorien</h3><div class="big"><div><small>Durchschnitt</small><b>${fmt(avg)} <em>kcal</em></b></div><div><small>Veränderung</small><b style="color:${df>=0?'var(--o)':'var(--g)'}">${df>0?'+':df<0?'−':''}${fmt(Math.abs(df))} <em>kcal</em></b></div></div><div class="dt">${rngTxt(s)}</div>${area(s)}<div class="lg"><span style="color:var(--ac)">${ic('v')}Verbrauch</span><span style="color:#ffd2bd">┄ Ziel</span></div></div>
  <div class="card"><h3>⚡ Kreatin</h3><div class="dt">${rngTxt(s)}</div>${bars(s)}<div class="lg"><span style="color:var(--cr)">▮ Eingenommen</span><span style="color:#cbb8ff">┄ Ziel</span></div></div>
  <h3 style="margin:22px 6px 12px;font-size:22px">Insights &amp; Daten</h3>
  <div class="card"><h3>🔥 Kalorien-Änderungen</h3>${trows('kcal','#ff9068','kcal')}</div>
  <div class="card"><h3>⚡ Kreatin-Änderungen</h3>${trows('cr','#a98bff','g')}</div>`},
m(){const G=S.goals,f=(i,l,v)=>`<label>${l}</label><input id="${i}" type="number" inputmode="decimal" min="0" value="${v}">`;
  return`<div class="card"><h3>🎯 Tagesziele</h3>${f('gk','Kalorien (kcal)',G.kcal)}${f('gc','Kohlenhydrate (g)',G.k)}${f('gf','Fett (g)',G.f)}${f('ge','Eiweiß (g)',G.e)}${f('gcr','Kreatin (g pro Tag)',G.cr)}<label>Zielgewicht (kg, 0 = aus)</label><input id="gwt" inputmode="decimal" value="${G.wt||0}">${f('gtw','Trainings pro Woche',G.tw)}</div>
  <div class="card"><h3>✨ Gemini</h3><p class="mu" style="margin:0;font-size:14px">Kostenloser Key: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com/apikey</a>. Er bleibt nur auf diesem Gerät. In der Gratis-Stufe darf Google Anfragen (auch Fotos) zur Produktverbesserung nutzen.</p>
  <label>API-Key</label><input id="gkey" type="password" autocomplete="off" value="${esc(gget('kt-gkey',''))}"><label>Modell</label><input id="gmod" value="${esc(gget('kt-gmodel','gemini-3.8-flash'))}"></div>
  <button class="pill" data-a="sv" style="margin-bottom:14px">Speichern</button>
  <div class="card"><h3>💾 Backup</h3><p class="mu" style="margin:0 0 8px;font-size:14px">Deine Daten liegen lokal auf dem iPhone. Sichere sie regelmäßig als Datei.</p><textarea id="bk" spellcheck="false">${esc(JSON.stringify(S))}</textarea>
  <div class="g2" style="margin-top:8px"><button class="pill ghost" data-a="bc" style="font-size:15px;padding:12px">Kopieren</button><button class="pill ghost" data-a="bd" style="font-size:15px;padding:12px">Als Datei</button></div><div class="row"><button class="pill ghost" data-a="bl" style="font-size:15px;padding:12px">Backup einfügen &amp; laden</button></div></div>`}};

function render(){
  const t=nice(),dn=tab==='h'||tab==='c'||tab==='b';
  $('#hd').innerHTML=`<button class="round glass" data-a="prev" style="visibility:${dn?'visible':'hidden'}" aria-label="Vorheriger Tag">${ic('l')}</button><div class="ttl" data-a="today"><b>${tab==='h'?t:tab==='c'?'Kreatin':tab==='b'?'Körper':tab==='v'?'Verlauf':'Einstellungen'}</b><small>${tab==='h'?'Tagebuch':tab==='c'||tab==='b'?t:tab==='v'?'Trends':'Ziele, Gemini & Backup'}</small></div><button class="round glass" data-a="next" style="visibility:${dn?'visible':'hidden'}" aria-label="Nächster Tag">${ic('r')}</button>`;
  $('#v').innerHTML=V[tab]();
  $('#tabs').style.setProperty('--i','hcbvm'.indexOf(tab));$('#tabs').style.setProperty('--tc',TC[tab]);
  $$('#tabs button').forEach(b=>{b.className=b.dataset.t===tab?'on':'';b.innerHTML=ic(b.dataset.t)+['Heute','Kreatin','Körper','Verlauf','Mehr']['hcbvm'.indexOf(b.dataset.t)]});
  $('#fab').classList.toggle('off',tab!=='h');
}
function $$(s){return[...document.querySelectorAll(s)]}
function shift(n){const d=new Date(cur+'T12:00:00');d.setDate(d.getDate()+n);cur=iso(d);render()}
function addFood(arr){const d=S.days[cur]=S.days[cur]||[];arr.forEach(x=>d.push({id:Date.now()+Math.random(),meal,...x}));save();render();closeSheet();toast(arr.length+(arr.length>1?' Einträge':' Eintrag')+' hinzugefügt')}
function addCr(g){if(!(g>0)){toast('Bitte Menge eingeben');return}const L=S.cr[cur]=S.cr[cur]||[];L.push({id:Date.now()+Math.random(),g,t:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr'});save();render();vib();toast('+'+r1(g)+' g Kreatin')}
function openSheet(m){if(m)meal=m;else{const h=new Date().getHours();meal=h<10?'fr':h<15?'mi':h<20?'ab':'sn'}drawMeal();drawRec();$('#sh').classList.add('on')}
function closeSheet(){$('#sh').classList.remove('on')}
function drawMeal(){$('#ml').innerHTML=MEALS.map(([i,n])=>`<button data-a="ml" data-m="${i}" class="${i===meal?'on':''}">${n.replace('Mittagessen','Mittag').replace('Frühstück','Früh').replace('Abendessen','Abend')}</button>`).join('')}
function drawPics(){$('#pics').innerHTML=pics.map((d,i)=>`<div><img src="${d}" alt="Foto ${i+1}"><button data-a="rp" data-p="${i}" aria-label="Foto entfernen">×</button></div>`).join('')}
function prep(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>rej(new Error('Bild nicht lesbar'));im.src=u})}
$('#fi').onchange=async e=>{for(const f of e.target.files){try{pics.push(await prep(f))}catch(x){toast(x.message)}}e.target.value='';drawPics()};

const SYS='Du bist ein Ernährungsrechner. Antworte NUR mit Zeilen im Format: Name | kcal:000,k:00,f:00,E:00 (k = Kohlenhydrate, f = Fett, E = Eiweiß, alles in Gramm, ganze Zahlen). Eine Zeile pro Lebensmittel, die geschätzte Menge steht im Namen. Bei Fotos: erkenne jedes Lebensmittel, schätze die Portion anhand von Tellergröße und Verpackung; bei Nährwerttabellen nutze die abgelesenen Werte. Schätze realistische Durchschnittswerte. Kein weiterer Text, kein Markdown.';
async function gem(){
  const q=$('#gq').value.trim(),key=gget('kt-gkey','');
  if(!q&&!pics.length){toast('Beschreibe dein Essen oder füge ein Foto hinzu');return}
  if(!key){toast('Bitte zuerst den API-Key unter „Mehr“ eintragen');return}
  const b=$('#gg');b.disabled=true;b.textContent='Gemini rechnet…';
  const parts=[{text:q||'Analysiere die Lebensmittel auf den Fotos.'},...pics.map(d=>({inlineData:{mimeType:'image/jpeg',data:d.split(',')[1]}}))];
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(gget('kt-gmodel','gemini-3.8-flash'))+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:[{parts}],generationConfig:{temperature:.2}})});
    const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);
    const t=((j.candidates||[])[0]?.content?.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('').trim();
    $('#ta').value=t;seg('tx');upPv();$('#gq').value='';pics=[];drawPics();
    toast(parseAll(t).length?'Ergebnis prüfen und hinzufügen':'Antwort nicht erkannt – bitte prüfen');
  }catch(e){toast('Gemini-Fehler: '+e.message)}
  b.disabled=false;b.textContent='Mit Gemini berechnen';
}
function seg(s){$$('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));$$('.sec').forEach(e=>e.classList.toggle('on',e.id==='s-'+s))}
function upPv(){const t=$('#ta').value,p=$('#pv'),a=parseAll(t);if(!t.trim()){p.textContent='';return}p.classList.toggle('err',!a.length);p.textContent=a.length?`${a.length} Eintrag${a.length>1?'e':''} erkannt · ${fmt(a.reduce((s,x)=>s+x.kcal,0))} kcal`:'Nichts erkannt. Beispiel: kcal:104,k:13,f:10,E:31'}
$('#ta').oninput=upPv;$('#gq').onkeydown=e=>{if(e.key==='Enter')gem()};

const A={
  tab:b=>{tab=b.dataset.t;render();scrollTo({top:0})},prev:()=>shift(-1),next:()=>shift(1),today:()=>{cur=iso(new Date());render()},
  open:b=>openSheet(b.dataset.m),bg:(b,e)=>{if(e.target.id==='sh')closeSheet()},seg:b=>seg(b.dataset.s),ml:b=>{meal=b.dataset.m;drawMeal()},
  wset:()=>{const v=pn($('#wi').value);if(!(v>20&&v<500)){toast('Bitte Gewicht in kg eingeben');return}S.w[cur]=Math.round(v*10)/10;save();render();vib();toast('⚖️ '+nm(S.w[cur])+' kg gespeichert')},
  wdel:()=>{delete S.w[cur];save();render()},wr:b=>{wr=+b.dataset.r;render()},go:b=>{cur=b.dataset.k;render()},
  tr:b=>{const v=b.dataset.v;if(S.tr[cur]===v)delete S.tr[cur];else S.tr[cur]=v;save();render();vib()},
  xadd:()=>{const n=$('#xn').value.trim(),kg=pn($('#xk').value)||0,r=$('#xr').value.trim(),sx=Math.max(1,parseInt($('#xs').value)||1);if(!n){toast('Bitte Übung eingeben');return}
    const all=Object.values(S.ex).flat().filter(x=>x.n.toLowerCase()===n.toLowerCase()).map(x=>x.kg||0).concat(S.pr.filter(x=>x.u==='kg'&&x.n.toLowerCase()===n.toLowerCase()).map(x=>x.v)),best=all.length?Math.max(...all):0;
    (S.ex[cur]=S.ex[cur]||[]).push({id:Date.now()+Math.random(),n,kg,r,s:sx});
    if(kg>0&&best>0&&kg>best){S.pr.push({id:Date.now()+Math.random(),n,v:kg,u:'kg',d:cur});toast('🏆 Neuer Rekord: '+n+' '+nm(kg)+' kg')}else toast('Übung gespeichert');save();render()},
  xdel:b=>{S.ex[cur]=(S.ex[cur]||[]).filter(x=>String(x.id)!==b.dataset.d);save();render()},
  padd:()=>{const n=$('#pn').value.trim(),v=pn($('#pv').value);if(!n||!(v>0)){toast('Bitte Übung und Wert eingeben');return}S.pr.push({id:Date.now()+Math.random(),n,v,u:$('#pu').value,d:cur});save();render();vib();toast('🏆 Rekord gespeichert')},
  pdel:b=>{S.pr=S.pr.filter(x=>String(x.id)!==b.dataset.d);save();render()},
  rec:b=>{const x=REC[+b.dataset.i];addFood([{name:x.name,kcal:x.kcal,k:x.k,f:x.f,e:x.e}])},pick:()=>$('#fi').click(),rp:b=>{pics.splice(+b.dataset.p,1);drawPics()},gem,
  addt:()=>{const a=parseAll($('#ta').value);if(!a.length){toast('Nichts erkannt – Format: kcal:104,k:13,f:10,E:31');return}addFood(a);$('#ta').value='';$('#pv').textContent=''},
  addm:()=>{const n=x=>parseFloat($(x).value)||0,k=n('#mc'),f=n('#mf'),e=n('#me'),kc=$('#mk').value===''?Math.round(4*k+9*f+4*e):n('#mk');
    if(!kc&&!k&&!f&&!e){toast('Bitte Werte eingeben');return}addFood([{name:$('#mn').value.trim()||'Eintrag',kcal:kc,k,f,e}]);['#mn','#mk','#mc','#mf','#me'].forEach(x=>$(x).value='')},
  gp:()=>copy('Gib mir die Nährwerte für: [HIER Lebensmittel und Menge einfügen]\nAntworte NUR in diesem Format, eine Zeile pro Lebensmittel, ohne weiteren Text:\nName | kcal:000,k:00,f:00,E:00\n(k = Kohlenhydrate in g, f = Fett in g, E = Eiweiß in g)'),
  del:b=>{S.days[cur]=dayF(cur).filter(x=>String(x.id)!==b.dataset.d);save();render()},
  cr:b=>addCr(+b.dataset.g),crc:()=>{addCr(parseFloat($('#cg').value.replace(',','.')))},dcr:b=>{S.cr[cur]=crL(cur).filter(x=>String(x.id)!==b.dataset.d);save();render()},
  rng:b=>{rng=+b.dataset.r;render()},
  sv:()=>{const v=x=>Math.max(0,parseFloat($(x).value)||0);S.goals={kcal:v('#gk'),k:v('#gc'),f:v('#gf'),e:v('#ge'),cr:v('#gcr'),wt:Math.max(0,pn($('#gwt').value)||0),tw:v('#gtw')};save();try{localStorage.setItem('kt-gkey',$('#gkey').value.trim());localStorage.setItem('kt-gmodel',$('#gmod').value.trim())}catch(e){}toast('Gespeichert')},
  bc:()=>copy(JSON.stringify(S)),
  bd:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='tracker-backup-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove()},
  bl:()=>{try{const p=JSON.parse($('#bk').value);if(!p||typeof p.days!=='object')throw 0;S=norm(p);save();render();toast('Backup geladen')}catch(e){toast('Backup ungültig')}}
};
document.addEventListener('change',e=>{if(e.target.id!=='xn')return;const n=e.target.value.trim().toLowerCase();for(const k of Object.keys(S.ex).sort().reverse()){const x=(S.ex[k]||[]).slice().reverse().find(y=>y.n.toLowerCase()===n);if(x){if(!$('#xk').value&&x.kg)$('#xk').value=nm(x.kg);if(!$('#xr').value)$('#xr').value=x.r;if(!$('#xs').value)$('#xs').value=x.s;break}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b,e)});
$('#fab').innerHTML=ic('p');
render();
</script>
</body></html>
